spring.application.name=wifi-ai-analyzer
spring.datasource.url=jdbc:postgresql://localhost:5432/wifi_ai_analyzer_db
spring.datasource.username=wifi
spring.datasource.password=wifi

spring.jpa.hibernate.ddl-auto=update

mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.topic=${MQTT_TOPIC:wifi/scan}
mqtt.qos=${MQTT_QOS:1}
mqtt.client-id=${MQTT_CLIENT_ID:wifi-ai-analyzer-backend}
